name: Build and Push Docker Images

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'
      - 'src/microservices/proxy/**'
      - 'src/microservices/events/**'
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push proxy service
        uses: docker/build-push-action@v2
        with:
          context: ./src/microservices/proxy
          file: ./src/microservices/proxy/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/proxy:latest

      - name: Build and push events service
        uses: docker/build-push-action@v2
        with:
          context: ./src/microservices/events
          file: ./src/microservices/events/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/events:latest

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './tests/postman/package-lock.json'

      - name: Install dependencies
        working-directory: ./tests/postman
        run: npm ci

      - name: Run API tests
        working-directory: ./tests/postman
        run: npm run test:local
        env:
          POSTMAN_API_URL: http://localhost:8000
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}

      